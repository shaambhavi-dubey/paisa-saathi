version: '3.8'

services:
  paisa-sathi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paisa-sathi-app
    ports:
      - "8000:8000"
    environment:
      - GNANI_API_KEY=${GNANI_API_KEY}
      - GNANI_BASE_URL=${GNANI_BASE_URL:-https://api.vachana.ai}
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    restart: unless-stopped

